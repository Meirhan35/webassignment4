<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3 - Bootstrap Validation Styles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Contact Form</h1>
        <form id="contactForm" novalidate>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" placeholder="Enter your name" required minlength="2" maxlength="30">
                    <div class="valid-feedback">Looks good!</div>
                    <div class="invalid-feedback">Name is required (2-30 characters).</div>
                </div>
                <div class="col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    <div class="valid-feedback">Looks good!</div>
                    <div class="invalid-feedback">Email is required and must be valid.</div>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-12">
                    <label for="message" class="form-label">Message</label>
                    <textarea class="form-control" id="message" rows="5" placeholder="Write your message here" required minlength="10" maxlength="200"></textarea>
                    <div class="valid-feedback">Looks good!</div>
                    <div class="invalid-feedback">Message is required (10-200 characters).</div>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('contactForm');
        const fields = form.querySelectorAll('input, textarea');

        form.addEventListener('submit', function (event) {
            event.preventDefault();
            fields.forEach(function (field) {
                if (field.checkValidity()) {
                    field.classList.add('is-valid');
                    field.classList.remove('is-invalid');
                } else {
                    field.classList.add('is-invalid');
                    field.classList.remove('is-valid');
                }
            });
        });
    </script>
</body>
</html>
